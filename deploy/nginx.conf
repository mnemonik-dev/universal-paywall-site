# Example nginx server block for a self-hosted deploy of the static site.
# Pair with scripts/deploy-server.sh (rsync target = root below).
server {
    listen 80;
    listen [::]:80;
    server_name universal-paywall.example;   # ← your domain

    root /var/www/universal-paywall;
    index index.html;

    # Astro emits /page/index.html; fall back cleanly for trailing-slash-less URLs.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Hashed assets are immutable.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
}
