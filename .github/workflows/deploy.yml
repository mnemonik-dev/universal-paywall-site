# Build the Astro site and publish dist/ to the gh-pages branch on every push.
# On a public repo, creating the gh-pages branch auto-enables GitHub Pages
# (Settings → Pages → Deploy from a branch), so no manual setup is needed.
# Served at: https://mnemonik-dev.github.io/universal-paywall-site/
# If you later add a custom domain, set SITE_URL to it and BASE_PATH to "/".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/universal-paywall-site-spec-2rwccu]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://mnemonik-dev.github.io
          BASE_PATH: /universal-paywall-site
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
